services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bug_agent
      POSTGRES_USER: bug_agent
      POSTGRES_PASSWORD: bug_agent
    ports: ["5432:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bug_agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["redis-data:/data"]

  minio:
    image: minio/minio:latest
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: bug_agent
      MINIO_ROOT_PASSWORD: bug_agent_dev_password
    ports: ["9000:9000", "9001:9001"]
    volumes: ["minio-data:/data"]

volumes:
  postgres-data:
  redis-data:
  minio-data:
